name: kano-navi-dev

services:
  kano-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: kano-navi:dev
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${KANO_PORT:-7657}:7657"
    environment:
      NODE_ENV: development
      APP_MODE: development
      PORT: 7657
      LLM_SECRETS_KEY: ${LLM_SECRETS_KEY:?Set LLM_SECRETS_KEY before starting}
      WORKFLOW_SCHEDULER_ENABLED: 0
    volumes:
      - .:/app
      - /app/node_modules
