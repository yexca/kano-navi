version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Deferred cleanup: Rollback after Commit reports sql.ErrTxDone, and a
      # removed temporary file inside an os.Root needs no further handling.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*os.Root).Remove
    staticcheck:
      # The golangci-lint defaults, without the De Morgan rewrite suggestion:
      # a negated range test reads more clearly than its expansion.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
  exclusions:
    # Unchecked Close, Flush, print and os.Remove results are the usual
    # cleanup idiom; every other ignored error must be handled or justified.
    presets:
      - std-error-handling
