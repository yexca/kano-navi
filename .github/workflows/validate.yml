name: Validate

# The job definitions shared by both validation tiers. PR, Full and Release
# call this file and choose the tier; it has no trigger of its own, so a tier
# is always an explicit decision of the caller.
on:
  workflow_call:
    inputs:
      tier:
        description: >-
          pr selects jobs from the changed paths; full runs every job.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Planning needs only Node and the diff, so every planned job starts without
  # waiting for Style, which runs beside them.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      backend: ${{ steps.plan.outputs.backend }}
      go: ${{ steps.plan.outputs.go }}
      frontend: ${{ steps.plan.outputs.frontend }}
      smoke: ${{ steps.plan.outputs.smoke }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
      # Full history without file contents: the diff against the PR base reads
      # only commits and trees.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Select required validation
        id: plan
        env:
          CI_TIER: ${{ inputs.tier }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make ci-plan

  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      # actionlint is built from its pinned Go module.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install locked dependencies
        run: make install
      - name: Check formatting, docs, workflows, CI policy, and source privacy
        run: make ci-style

  backend:
    name: Backend
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go lint, vet and race-enabled contracts
        run: make ci-backend

  go:
    name: Go gate
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting, cross-builds and the read-only container
        run: make go-check

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Install locked dependencies
        run: make install
      - name: Verify registry signatures of the installed packages
        run: make npm-audit-signatures
      - name: Type-check, build and test the frontend
        run: make ci-frontend

  smoke:
    name: API smoke
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check isolated seed and HTTP snapshot through the Go backend
        run: make smoke

  docker:
    name: Docker image
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cache production image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kano-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'package.json', 'package-lock.json', 'backend/**', 'src/**', 'public/**', 'index.html', 'tsconfig*.json', 'vite.config.ts', 'tailwind.config.ts', 'Makefile', 'LICENSE') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image (Go backend and built frontend)
        run: >-
          make DOCKER_IMAGE=kano-navi:ci
          DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/kano-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/kano-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/kano-buildx-cache"
          mv -- "$RUNNER_TEMP/kano-buildx-cache-next" "$RUNNER_TEMP/kano-buildx-cache"
      - name: Check production runtime
        run: make DOCKER_IMAGE=kano-navi:ci production-smoke

  # The only result a caller or a ruleset needs: it fails unless every planned
  # job succeeded, and only the plan may authorize a skipped job.
  gate:
    name: Gate
    if: always()
    needs: [plan, style, backend, go, frontend, smoke, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Verify all planned validation results
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make ci-results
