name: Validate

# The job definitions shared by the PR and Full validation tiers.
# call this file and choose the tier; it has no trigger of its own, so a tier
# is always an explicit decision of the caller.
on:
  workflow_call:
    inputs:
      tier:
        description: >-
          pr selects jobs from the changed paths; full runs every job.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Planning needs only Node and the diff, so every planned job starts without
  # waiting for Style, which runs beside them.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      backend: ${{ steps.plan.outputs.backend }}
      go-builds: ${{ steps.plan.outputs.go-builds }}
      go-container: ${{ steps.plan.outputs.go-container }}
      frontend: ${{ steps.plan.outputs.frontend }}
      smoke: ${{ steps.plan.outputs.smoke }}
      docker: ${{ steps.plan.outputs.docker }}
      go-audit: ${{ steps.plan.outputs.go-audit }}
      npm-audit: ${{ steps.plan.outputs.npm-audit }}
    steps:
      # Full history without file contents: the diff against the PR base reads
      # only commits and trees.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Select required validation
        id: plan
        env:
          CI_TIER: ${{ inputs.tier }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make ci-plan

  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      # actionlint is built from its pinned Go module.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install locked dependencies
        run: make install
      - name: Check formatting, docs, workflows, CI policy, and source privacy
        run: make ci-style

  backend:
    name: Backend (${{ matrix.check }})
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Lint and vet run once; the race suite is split across four runners.
        # The slices share a compilation cache, saved by the first race job.
        include:
          - check: static
            target: ci-backend-static
            cache: static
            save_cache: true
          - check: race 1/4
            target: RACE_SHARD=1/4 backend-race-shard
            slice: 1
            cache: race
            save_cache: true
          - check: race 2/4
            target: RACE_SHARD=2/4 backend-race-shard
            slice: 2
            cache: race
          - check: race 3/4
            target: RACE_SHARD=3/4 backend-race-shard
            slice: 3
            cache: race
          - check: race 4/4
            target: RACE_SHARD=4/4 backend-race-shard
            slice: 4
            cache: race
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: false
      - name: Set up Node.js for race sharding
        if: matrix.cache == 'race'
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Restore Go modules and tool dependencies
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Restore Go compilation and lint results
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.cache }}-${{ hashFiles('backend/**/*.go', 'backend/**/*.sql', 'backend/go.mod', 'backend/go.sum', 'scripts/golangci-lint.yml', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.cache }}-
      - name: Run backend checks
        env:
          RACE_EVENTS: ${{ runner.temp }}/race-events.json
        run: make ${{ matrix.target }}
      - name: Save Go modules from the static job
        if: matrix.check == 'static' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Save Go compilation and lint results
        if: matrix.save_cache && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.build.outputs.cache-primary-key }}
      - name: Upload race test events
        if: matrix.slice
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-race-events-${{ matrix.slice }}
          path: ${{ runner.temp }}/race-events.json
          retention-days: 30

  # The two halves of make go-check that Style and Backend do not cover. Each
  # keeps its own compilation cache keyed by the Go sources, as Backend does.
  go-builds:
    name: Go builds
    needs: plan
    if: needs.plan.outputs.go-builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Restore Go modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cache Go compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-builds-${{ hashFiles('backend/**/*.go', 'backend/**/*.sql', 'backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-builds-
      - name: Run CGO-free contracts and Linux/Windows builds
        run: make go-build-check

  go-container:
    name: Go container
    needs: plan
    if: needs.plan.outputs.go-container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The smoke builds its synthetic snapshot with the host toolchain.
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Restore Go modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cache Go compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-container-${{ hashFiles('backend/**/*.go', 'backend/**/*.sql', 'backend/go.mod', 'backend/go.sum', 'Makefile') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-container-
      - name: Build the service image and smoke its read-only container
        run: make go-container-check

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Install locked dependencies
        run: make install
      - name: Verify registry signatures of the installed packages
        run: make npm-audit-signatures
      - name: Type-check, build and test the frontend
        run: make ci-frontend

  smoke:
    name: API smoke
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check isolated seed and HTTP snapshot through the Go backend
        run: make smoke

  docker:
    name: Docker image
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cache production image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kano-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/**', 'package.json', 'package-lock.json', 'backend/**', 'src/**', 'public/**', 'index.html', 'tsconfig*.json', 'vite.config.ts', 'Makefile', 'LICENSE') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image (Go backend and built frontend)
        run: >-
          make DOCKER_IMAGE=kano-navi:ci
          DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/kano-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/kano-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/kano-buildx-cache"
          mv -- "$RUNNER_TEMP/kano-buildx-cache-next" "$RUNNER_TEMP/kano-buildx-cache"
      - name: Check production runtime
        run: make DOCKER_IMAGE=kano-navi:ci production-smoke

  # The advisory audits run only for a pull request that changes the matching
  # manifest; the daily Dependency audit workflow covers main.
  go-audit:
    name: Go audit
    needs: plan
    if: needs.plan.outputs.go-audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check reachable vulnerabilities in modules and the standard library
        run: make go-audit

  npm-audit:
    name: npm audit
    needs: plan
    if: needs.plan.outputs.npm-audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The advisory audits read only package-lock.json; Frontend verifies the
      # registry signatures of its installation.
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Audit the production dependencies
        run: make npm-audit-production
      - name: Audit the full locked dependency tree
        if: ${{ !cancelled() }}
        run: make npm-audit

  # The only result a caller or a ruleset needs: it fails unless every planned
  # job succeeded, and only the plan may authorize a skipped job.
  gate:
    name: Gate
    if: always()
    needs:
      [
        plan,
        style,
        backend,
        go-builds,
        go-container,
        frontend,
        smoke,
        docker,
        go-audit,
        npm-audit,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: "false"
      - name: Verify all planned validation results
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: make ci-results
