name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: kano-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: kano-navi
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}

jobs:
  verify-release:
    name: Verify release source and validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      # Full history, so the tag can be compared with main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag and version
        run: |
          expected_tag="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected_tag." >&2
            exit 1
          fi

      - name: Verify release notes
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_file" ]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi

      - name: Verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main." >&2
            exit 1
          fi

      # Full validates every main commit and keeps its result. Reuse only a
      # successful run for this exact commit; never accept another revision.
      - name: Require a successful Full run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/full.yml/runs?head_sha=${GITHUB_SHA}&per_page=100"
          passed="$(gh api "${runs_api}&status=success" --jq '.workflow_runs | length')"
          if [ "$passed" -gt 0 ]; then
            echo "Full passed for ${GITHUB_SHA}."
            exit 0
          fi
          echo "No successful Full run exists for ${GITHUB_SHA}. Wait for Full to pass, or start it on ${GITHUB_REF_NAME} from the Actions page, then rerun this release." >&2
          gh api "$runs_api" --jq '.workflow_runs[] | "\(.html_url) status=\(.status) conclusion=\(.conclusion)"' >&2
          exit 1

  publish-image:
    name: Publish container image to Docker Hub and GHCR
    runs-on: ubuntu-latest
    needs: verify-release
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kano Mahoro Status Board
            org.opencontainers.image.description=Unofficial fan-made status board for Kano Mahoro

      # ./Dockerfile compiles the Go backend and the frontend into one image.
      # Go cross-compiles each platform, so no QEMU emulation is needed. It
      # keeps no layer cache (docs/operations/docker.md says why).
      - name: Build and push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: publish-image
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The tracked release note is the Release body; a rerun synchronizes it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish release with the tracked notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="docs/history/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
