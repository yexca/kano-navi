name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kano-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked dependencies
        run: make install
      - name: Check formatting, docs, and source privacy
        run: make ci-style

  backend:
    name: Backend
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked dependencies
        run: make install
      - name: Test server contracts
        run: make ci-backend

  frontend:
    name: Frontend
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked dependencies
        run: make install
      - name: Build frontend
        run: make ci-frontend

  smoke:
    name: API smoke
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install locked dependencies
        run: make install
      - name: Check isolated seed and HTTP snapshot
        run: make smoke

  docker:
    name: Docker image
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Cache production image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kano-buildx-cache
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', '.dockerignore', 'package.json', 'package-lock.json', 'server/**', 'scripts/**', 'src/**', 'public/**', 'index.html', 'vite.config.js', 'tailwind.config.js', 'Makefile', 'LICENSE') }}
          restore-keys: docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Build production image
        run: >-
          make DOCKER_IMAGE=kano-navi:ci
          DOCKER_BUILD="docker buildx build"
          DOCKER_BUILD_ARGS="--load --cache-from type=local,src=$RUNNER_TEMP/kano-buildx-cache --cache-to type=local,dest=$RUNNER_TEMP/kano-buildx-cache-next,mode=max"
          docker-build
      - name: Replace exported layer cache
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/kano-buildx-cache"
          mv -- "$RUNNER_TEMP/kano-buildx-cache-next" "$RUNNER_TEMP/kano-buildx-cache"
      - name: Check production runtime
        run: make DOCKER_IMAGE=kano-navi:ci production-smoke

  validate:
    name: Validate
    if: always()
    needs: [style, backend, frontend, smoke, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation phase
        env:
          STYLE_RESULT: ${{ needs.style.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$STYLE_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" "$SMOKE_RESULT" "$DOCKER_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required validation phase ended with: $result"
              exit 1
            fi
          done
