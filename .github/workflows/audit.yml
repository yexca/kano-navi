name: Dependency audit

on:
  schedule:
    # Daily at 03:17 UTC (12:17 Japan time), off the top of the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kano-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm advisories
    # Forks inherit the schedule; only the upstream repository runs it.
    if: github.repository == 'yexca/kano-navi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      # The advisory audits read only package-lock.json.
      - name: Audit the production dependencies
        run: make npm-audit-production
      - name: Audit the full locked dependency tree
        if: ${{ !cancelled() }}
        run: make npm-audit
      # Signature verification reads the installed packages.
      - name: Install locked dependencies
        if: ${{ !cancelled() }}
        run: make install
      - name: Verify registry signatures of the installed packages
        if: ${{ !cancelled() }}
        run: make npm-audit-signatures

  go:
    name: Go vulnerabilities
    if: github.repository == 'yexca/kano-navi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The go.mod version matches the release image, so standard library
      # findings describe the shipped toolchain.
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Check reachable vulnerabilities in modules and the standard library
        run: make go-audit
