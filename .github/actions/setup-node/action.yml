name: Set up Node
description: Install the Node version pinned in .nvmrc.
inputs:
  cache:
    description: Restore the npm download cache keyed by package-lock.json.
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: package-lock.json
